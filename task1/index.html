<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Task 1 — Selector Detective</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎂 Selector Detective</h1>
  <p class="sub">Who took the birthday cake? Press a case button — jQuery searches the page.</p>

  <section id="panel">
    <div id="cases"></div>
    <div id="result">
      <p id="result-text">Choose a case.</p>
      <pre id="chain">// the jQuery chain of the case appears here</pre>
    </div>
  </section>

  <div id="house-wrap">
    <div id="roof"></div>
    <div id="roof-bar"></div>
    <div id="sign">The Party, 19:30 – 22:30</div>
    <div id="house"></div>
    <div id="ground"></div>
    <div id="legend"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="data.js"></script>
  <script src="cases.js"></script>
  <script src="app.js"></script>
</body>
</html>
